[project]
name = "openhands-dependency-remediation-demo"
version = "0.1.0"
description = "Fast Jira-driven dependency remediation demo for OpenHands Enterprise"
requires-python = ">=3.11"

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "ruff==0.12.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dependency_demo"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
